name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch: # Allow manual re-run of audit jobs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + typecheck + format + tests under non-superuser role)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS image so geoalchemy2/Geometry tests can run against a clean DB.
        # POSTGRES_USER is deliberately the superuser `postgres`; we then create a
        # NON-superuser application role and run migrations + the whole test suite
        # (including the restore drill) under it. This ensures the exact
        # production-realistic failure mode (e.g. `permission denied to create
        # extension "postgis"`) is exercised in CI instead of being silently
        # masked by the image's default-superuser POSTGRES_USER.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: arkidi_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_superuser_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arkidi_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: testing
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: arkidi_db
      # Non-superuser application role (created in the provisioning step below).
      DATABASE_USER: arkidi_app
      DATABASE_PASSWORD: ci_app_password
      # Privileged role used ONLY to provision PostGIS in the restore drill's
      # scratch database (a non-superuser cannot CREATE EXTENSION postgis).
      DATABASE_ADMIN_USER: postgres
      DATABASE_ADMIN_PASSWORD: ci_superuser_password
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-secret-key-for-tests-only-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Provision non-superuser application role
        env:
          PGPASSWORD: ci_superuser_password
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d arkidi_db <<'SQL'
          CREATE ROLE arkidi_app LOGIN NOSUPERUSER NOCREATEROLE CREATEDB PASSWORD 'ci_app_password';
          GRANT CONNECT ON DATABASE arkidi_db TO arkidi_app;
          GRANT CREATE, USAGE ON SCHEMA public TO arkidi_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO arkidi_app;
          SQL
          # Sanity-check the role really is NOT a superuser (the whole point).
          psql -t -A -h localhost -p 5432 -U postgres -d arkidi_db \
            -c "SELECT 'rolsuper=' || rolsuper || ' rolcreatedb=' || rolcreatedb FROM pg_roles WHERE rolname='arkidi_app'"

      - name: Run Alembic migrations against the clean database (as non-superuser)
        run: alembic upgrade head

      - name: Lint (ruff)
        run: ruff check app tests --exclude alembic/versions

      - name: Type check (mypy)
        run: mypy app

      - name: Check formatting (black)
        run: black --check .

      - name: Run backend tests with coverage (as non-superuser, incl. restore drill)
        # Coverage ratchet: the suite currently sits at ~73%. This floor blocks
        # regressions without being aspirational; raise it as the pre-existing
        # integration failures (see tests/test_password_reset.py) get fixed.
        run: pytest -p no:cacheprovider -p no:warnings -q --cov=app --cov-fail-under=70 --cov-report=term-missing

  frontend:
    name: Frontend (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc -b

      - name: Lint (eslint)
        run: npm run lint

      - name: Run component/route tests (vitest)
        run: npm test

      - name: Production build (code-split bundles)
        run: npm run build

  pip-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    # Runs on schedule (Mondays 00:00 UTC) or manually via workflow_dispatch.
    # Skipped on push/PR — those paths don't need weekly audits.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements-dev.txt

  npm-audit:
    name: NPM dependency vulnerability audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit NPM dependencies
        run: npm audit
        working-directory: frontend

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml + prod overlay parse cleanly
        run: |
          # docker compose config does a full parse + resolution of the merged
          # config; it will fail if any overlay has structural issues (e.g. a
          # service indented into another, like the celery-worker bug).
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: YAML syntax lint (catches indentation bugs like the celery-worker one)
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml, sys
          files = ["docker-compose.yml", "docker-compose.prod.yml"]
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f"OK: {f}")
              except yaml.YAMLError as e:
                  print(f"FAIL: {f} - {e}")
                  sys.exit(1)
          PY