# Arkidi Platform frontend — Nginx configuration (runtime-substituted template).
#
# The Docker production image copies this file to
# /etc/nginx/conf.d/default.conf.template and `docker-entrypoint.sh` swaps the
# __TOKENS__ using the container environment (SERVER_NAME / SSL_CERT_PATH /
# SSL_KEY_PATH). Tokens are all-caps underscore strings so they never collide
# with nginx $variables.

# --- HTTP listener: 301 → HTTPS ---------------------------------------------
server {
    listen 80;
    server_name __SERVER_NAME__;

    # Redirect every plain-HTTP request to the canonical public domain.
    return 301 https://$host$request_uri;
}

# --- HTTPS listener: TLS termination + SPA + API reverse proxy ---------------
server {
    listen 443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;

    # Modern TLS only (TLS 1.2+). Adjust if older clients must be supported.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL_CACHE:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static Vite/React build
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Externally reachable health endpoint (used by LB / uptime monitors).
    location = /health {
        access_log off;
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API reverse proxy: same-origin /api/* -> FastAPI backend.
    # No proxy_pass URI is given, so the full request path (/api/v1/...) is
    # forwarded unchanged to the backend's /api/v1 router.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Matches backend MAX_UPLOAD_SIZE_MB (50 MB).
        client_max_body_size 50m;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}