# Arkidi Platform — Production Compose Overlay
# Use with the base file:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires .env.production (template: .env.production.example):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD,
#   REDIS_PASSWORD, SECRET_KEY, CORS_ORIGINS,
#   SERVER_NAME, SSL_CERT_PATH, SSL_KEY_PATH,
#   BACKUP_KEEP_DAYS, BACKUP_INTERVAL_HOURS
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: arkidi-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arkidi-prod-network

  redis:
    image: redis:7-alpine
    container_name: arkidi-redis-prod
    restart: always
    # Fail closed: REDIS_PASSWORD is required in production.
    command: >
      sh -c 'if [ -z "$REDIS_PASSWORD" ]; then echo "REDIS_PASSWORD required" >&2; exit 1; fi;
             exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"'
    volumes:
      - redis_prod_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arkidi-prod-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkidi-backend-prod
    restart: always
    # Default container command is uvicorn (see docker-entrypoint.sh); it also waits
    # for Postgres then runs `alembic upgrade head` automatically.
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Used by the default uvicorn target in docker-entrypoint.sh
      BACKEND_WORKERS: ${BACKEND_WORKERS:-4}
    volumes:
      - backend_prod_uploads:/app/file-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - arkidi-prod-network

    celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkidi-celery-prod
    restart: always
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q default,archive
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_ADMIN_USER: ${DATABASE_ADMIN_USER:-postgres}
      DATABASE_ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD:-${POSTGRES_PASSWORD}}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      # Backup & cloud config (consumed by app/tasks/backups.py + backup.sh)
      BACKUP_BASE_PATH: ${BACKUP_BASE_PATH:-/app/backups}
      GCS_ENABLED: ${GCS_ENABLED:-false}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}
      B2_ENABLED: ${B2_ENABLED:-false}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      # Alerting (consumed by app/utils/alerts.py)
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      RUN_MIGRATIONS: "false"
    volumes:
      - backend_prod_uploads:/app/file-storage
      - backend_prod_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arkidi-prod-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkidi-celery-beat-prod
    restart: always
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_ADMIN_USER: ${DATABASE_ADMIN_USER:-postgres}
      DATABASE_ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD:-${POSTGRES_PASSWORD}}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      # Backup & cloud config (consumed by app/tasks/backups.py + backup.sh)
      BACKUP_BASE_PATH: ${BACKUP_BASE_PATH:-/app/backups}
      GCS_ENABLED: ${GCS_ENABLED:-false}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_CREDENTIALS_PATH: ${GCS_CREDENTIALS_PATH:-}
      B2_ENABLED: ${B2_ENABLED:-false}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      # Alerting (consumed by app/utils/alerts.py)
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      RUN_MIGRATIONS: "false"
    volumes:
      - backend_prod_uploads:/app/file-storage
      - backend_prod_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arkidi-prod-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: arkidi-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by frontend/docker-entrypoint.sh to render nginx.conf
      SERVER_NAME: ${SERVER_NAME:-localhost}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/nginx/certs/privkey.pem}
    # TLS certificates: bind-mount real certificates, e.g.
    #   - /etc/letsencrypt/live/app.arkidi.org/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
    #   - /etc/letsencrypt/live/app.arkidi.org/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    volumes:
      - ./tls/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - arkidi-prod-network

  # ------------------------------------------------------------------
  # Backups & Restore Drills
  # ------------------------------------------------------------------
  # Scheduled backups and weekly restore drills are now orchestrated by
  # Celery Beat (celery-beat service above) via:
  #   * app/tasks/backups.py -> backup.run_nightly_backup      (daily 01:30)
  #   * app/tasks/backups.py -> backup.run_weekly_restore_drill (Sun 03:30)
  #
  # backup.sh produces a local pg_dump + file-storage tarball and uploads
  # to GCS/B2 via scripts/cloud_upload.py when enabled.
  # The backup artefacts are persisted to the backend_prod_backups volume
  # mounted on the celery-worker container (see above).
  #
  # The previous standalone `backup` service (postgis/postgis image with a
  # sleep-loop cron) has been removed: scheduling now lives in one place
  # (beat_schedule in app/tasks/celery_app.py) and runs inside the Python
  # image where google-cloud-storage / b2sdk are installed.

networks:
  arkidi-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  backend_prod_uploads:
  backend_prod_backups:
