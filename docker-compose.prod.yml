services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: arkidi-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arkidi-prod-network

  redis:
    image: redis:7-alpine
    container_name: arkidi-redis-prod
    restart: always
    # Fail closed: REDIS_PASSWORD is a required variable in production.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - arkidi-prod-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkidi-backend-prod
    restart: always
    # Default container command is uvicorn (see docker-entrypoint.sh); it also
    # waits for Postgres and runs `alembic upgrade head` automatically.
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Required for the default uvicorn target in docker-entrypoint.sh
      BACKEND_WORKERS: ${BACKEND_WORKERS:-4}
    volumes:
      - backend_prod_uploads:/app/file-storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arkidi-prod-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkidi-celery-prod
    restart: always
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      RUN_MIGRATIONS: "false"
    volumes:
      - backend_prod_uploads:/app/file-storage
    depends_on:
      - postgres
      - redis
    networks:
      - arkidi-prod-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkidi-celery-beat-prod
    restart: always
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      RUN_MIGRATIONS: "false"
    volumes:
      - backend_prod_uploads:/app/file-storage
    depends_on:
      - postgres
      - redis
    networks:
      - arkidi-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: arkidi-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - arkidi-prod-network

networks:
  arkidi-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  backend_prod_uploads:
